spring.application.name=recommendation-system

# Server Port (8888 to avoid Windows Hyper-V reserved port range)
server.port=8888

spring.datasource.url=jdbc:mysql://localhost:3306/rec_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Stable graduation-defense accounts: dabian1 / dabian2, password: password
demo.accounts.enabled=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Config (DeepSeek)
ai.api.url=https://api.deepseek.com/v1/chat/completions
ai.api.key=${DEEPSEEK_API_KEY:}
ai.model=deepseek-chat

# Kaggle Config
kaggle.api.key=${KAGGLE_API_KEY:}

# Redis Cache Config
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=none

# Ollama Local AI Config (自动打标签)
ollama.url=http://localhost:11434
ollama.model=qwen3.5:0.8b

# Ollama AI 推荐策略配置（使用 8B 大模型）
ollama.rec.model=qwen3:8b
ollama.rec.temperature=0.3
ollama.rec.num-predict=500

# AI 推荐缓存配置（异步预计算架构）
ai.cache.ttl-minutes=10

# JWT Config
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
