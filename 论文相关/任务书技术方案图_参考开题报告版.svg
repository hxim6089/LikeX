<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
  <defs>
    <style>
      .label { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 28px; font-weight: 700; fill: #111827; }
