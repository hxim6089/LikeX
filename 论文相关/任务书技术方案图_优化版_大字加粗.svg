  <!-- Execution architecture bars -->
  <rect x="58" y="760" width="280" height="45" class="bluebar"/>
  <text x="198" y="789" text-anchor="middle" class="bar-text">客户端执行架构</text>
  <rect x="58" y="805" width="280" height="44" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="198" y="833" text-anchor="middle" class="small-text">浏览器、PC 或移动端访问</text>

  <rect x="390" y="760" width="635" height="45" class="bluebar"/>
  <text x="708" y="789" text-anchor="middle" class="bar-text">应用层执行架构</text>
  <rect x="390" y="805" width="635" height="44" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="708" y="833" text-anchor="middle" class="small-text">Spring Boot 服务、推荐算法服务、WebSocket 消息服务、AI 接口调用</text>

  <rect x="1110" y="760" width="340" height="45" class="bluebar"/>
