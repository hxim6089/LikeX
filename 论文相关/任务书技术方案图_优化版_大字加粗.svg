  <text x="820" y="526" text-anchor="middle" class="small-text">行为信号</text>
  <text x="1075" y="510" text-anchor="middle" class="small-text">数据对象</text>
  <text x="1298" y="511" text-anchor="middle" class="small-text">JDBC</text>

  <path d="M 941 430 C 915 388, 735 388, 707 448" class="arrow-dash"/>
