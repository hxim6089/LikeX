  <text x="53" y="122" text-anchor="middle" class="side-text">架构</text>

  <rect x="22" y="205" width="62" height="170" class="side"/>
  <text x="53" y="274" text-anchor="middle" class="side-text">技术</text>
  <text x="53" y="308" text-anchor="middle" class="side-text">实现</text>

