  <text x="1382" y="538" text-anchor="middle" class="small-text">MySQL</text>

  <rect x="1130" y="615" width="140" height="42" class="card-gray"/>
  <text x="1200" y="641" text-anchor="middle" class="small-text">外部数据导入</text>
  <rect x="1325" y="610" width="115" height="52" class="card-gray"/>
