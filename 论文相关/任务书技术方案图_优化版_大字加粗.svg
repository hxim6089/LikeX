  <text x="1382" y="650" text-anchor="middle" class="small-text">模拟数据</text>

  <path d="M 290 510 L 390 510" class="arrow"/>
  <path d="M 540 520 L 632 520" class="arrow"/>
  <path d="M 782 544 L 858 544" class="arrow"/>
  <path d="M 1023 528 L 1130 528" class="arrow"/>
  <path d="M 1270 528 L 1325 528" class="arrow"/>
  <path d="M 1270 636 L 1325 636" class="arrow"/>

