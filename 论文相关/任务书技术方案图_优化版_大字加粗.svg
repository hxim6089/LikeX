<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .row { fill: #f5f7fa; stroke: none; }
      .side { fill: #d9d9d9; stroke: none; }
      .client { fill: #9dc9ef; stroke: none; }
      .app { fill: #a8c900; stroke: none; }
      .data { fill: #8fc8e9; stroke: none; }
      .card { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 7; ry: 7; }
      .card-gray { fill: #e8e8e8; stroke: #b8b8b8; stroke-width: 1.2; rx: 5; ry: 5; }
      .dash-box { fill: #fff; stroke: #e11d48; stroke-width: 2; stroke-dasharray: 8 6; rx: 8; ry: 8; }
      .v-blue { stroke: #11b8ee; stroke-width: 2; stroke-dasharray: 8 7; }
      .v-gray { stroke: #a5a5a5; stroke-width: 2; stroke-dasharray: 8 7; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-dash { stroke: #475569; stroke-width: 1.8; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .db { fill: #bbd99f; stroke: #0ea5d8; stroke-width: 2; }
      .bluebar { fill: #33649d; stroke: none; }
      .side-text { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 28px; font-weight: 700; fill: #111827; }
      .layer-text { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 27px; font-weight: 700; fill: #111827; }
      .module-text { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 22px; font-weight: 700; fill: #111827; }
      .body-text { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 19px; font-weight: 600; fill: #111827; }
      .small-text { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 16px; font-weight: 600; fill: #374151; }
      .bar-text { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="900" class="bg"/>

  <!-- Left labels -->
  <rect x="22" y="24" width="62" height="160" class="side"/>
