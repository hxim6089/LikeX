    <text class="body" x="1056" y="408">双候选源召回</text>
    <text class="body" x="1056" y="443">多信号混合排序</text>
    <text class="body" x="1056" y="478">用户画像与标签</text>
    <text class="body" x="1056" y="513">协同过滤与热门加成</text>
    <text class="body" x="1056" y="548">AI 推荐与降级</text>

    <!-- Technical row: data and external -->
    <rect x="1308" y="262" width="426" height="354" rx="7" fill="#ffffff" stroke="#bed0e2" stroke-width="2"/>
    <rect x="1308" y="262" width="426" height="48" rx="7" fill="#dceaf5"/>
    <rect x="1308" y="303" width="426" height="7" fill="#dceaf5"/>
