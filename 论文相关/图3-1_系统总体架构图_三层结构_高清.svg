<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .band-title { font-size: 24px; font-weight: 700; fill: #ffffff; }
      .col-title { font-size: 27px; font-weight: 700; fill: #ffffff; }
      .section-title { font-size: 23px; font-weight: 700; }
      .box-title { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #536176; }
      .flow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .flow-bi { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-start: url(#arrowBlue); marker-end: url(#arrowBlue); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1800" height="1050" fill="#f7f9fc"/>
  <rect x="18" y="18" width="1764" height="1014" rx="10" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>

  <!-- Row backgrounds -->
  <rect x="38" y="42" width="1724" height="172" rx="8" fill="#edf3f9"/>
  <rect x="38" y="232" width="1724" height="414" rx="8" fill="#f8fafc"/>
  <rect x="38" y="664" width="1724" height="340" rx="8" fill="#f2f6fb"/>

  <!-- Left-side row labels -->
  <rect x="38" y="42" width="66" height="172" rx="8" fill="#46566c"/>
  <rect x="38" y="232" width="66" height="414" rx="8" fill="#46566c"/>
  <rect x="38" y="664" width="66" height="340" rx="8" fill="#46566c"/>
  <text class="band-title" x="71" y="76" text-anchor="middle">
    <tspan x="71" dy="0">系</tspan><tspan x="71" dy="30">统</tspan><tspan x="71" dy="30">架</tspan><tspan x="71" dy="30">构</tspan>
  </text>
  <text class="band-title" x="71" y="313" text-anchor="middle">
    <tspan x="71" dy="0">技</tspan><tspan x="71" dy="30">术</tspan><tspan x="71" dy="30">实</tspan><tspan x="71" dy="30">现</tspan>
  </text>
  <text class="band-title" x="71" y="756" text-anchor="middle">
    <tspan x="71" dy="0">运</tspan><tspan x="71" dy="30">行</tspan><tspan x="71" dy="30">流</tspan><tspan x="71" dy="30">程</tspan>
  </text>

  <!-- System architecture row -->
  <g filter="url(#shadow)">
    <rect x="132" y="68" width="360" height="120" rx="7" fill="#ffffff" stroke="#75a9d3" stroke-width="2"/>
    <rect x="132" y="68" width="360" height="46" rx="7" fill="#4f9fd3"/>
    <rect x="132" y="107" width="360" height="7" fill="#4f9fd3"/>
    <text class="col-title" x="312" y="100" text-anchor="middle">客户端</text>
    <text class="section-title" x="312" y="146" text-anchor="middle">浏览器访问与交互展示</text>
    <text class="small" x="312" y="174" text-anchor="middle">页面渲染 · 状态管理 · 实时消息</text>

    <rect x="535" y="68" width="730" height="120" rx="7" fill="#ffffff" stroke="#84b900" stroke-width="2"/>
    <rect x="535" y="68" width="730" height="46" rx="7" fill="#89bc00"/>
    <rect x="535" y="107" width="730" height="7" fill="#89bc00"/>
    <text class="col-title" x="900" y="100" text-anchor="middle">Spring Boot 应用服务层</text>
    <text class="section-title" x="900" y="146" text-anchor="middle">接口接入 · 核心业务 · 推荐智能</text>
    <text class="small" x="900" y="174" text-anchor="middle">统一承载系统业务处理与算法计算</text>

    <rect x="1308" y="68" width="426" height="120" rx="7" fill="#ffffff" stroke="#69b8dd" stroke-width="2"/>
    <rect x="1308" y="68" width="426" height="46" rx="7" fill="#58add5"/>
    <rect x="1308" y="107" width="426" height="7" fill="#58add5"/>
    <text class="col-title" x="1521" y="100" text-anchor="middle">数据与外部服务层</text>
    <text class="section-title" x="1521" y="146" text-anchor="middle">数据持久化与能力扩展</text>
    <text class="small" x="1521" y="174" text-anchor="middle">MySQL · AI 服务 · 数据集 · 文件目录</text>
  </g>

  <!-- Architecture arrows -->
  <path class="flow-bi" d="M 497 128 L 527 128"/>
  <path class="flow-bi" d="M 1272 128 L 1300 128"/>

  <!-- Technical row: client -->
  <g filter="url(#shadow)">
    <rect x="132" y="262" width="360" height="354" rx="7" fill="#ffffff" stroke="#bed0e2" stroke-width="2"/>
    <rect x="132" y="262" width="360" height="48" rx="7" fill="#dceaf5"/>
    <rect x="132" y="303" width="360" height="7" fill="#dceaf5"/>
    <text class="section-title" x="312" y="294" text-anchor="middle">前端技术栈</text>

    <rect x="166" y="334" width="292" height="52" rx="5" fill="#eff6ff" stroke="#8cb9db"/>
    <text class="box-title" x="312" y="366" text-anchor="middle">Vue 3 / Vite</text>
    <rect x="166" y="400" width="292" height="52" rx="5" fill="#eff6ff" stroke="#8cb9db"/>
    <text class="box-title" x="312" y="432" text-anchor="middle">Vue Router / Element Plus</text>
    <rect x="166" y="466" width="292" height="52" rx="5" fill="#eff6ff" stroke="#8cb9db"/>
    <text class="box-title" x="312" y="498" text-anchor="middle">Axios / REST API</text>
    <rect x="166" y="532" width="292" height="52" rx="5" fill="#eff6ff" stroke="#8cb9db"/>
    <text class="box-title" x="312" y="564" text-anchor="middle">STOMP / SockJS / ECharts</text>

    <!-- Technical row: application -->
    <rect x="535" y="262" width="730" height="354" rx="7" fill="#ffffff" stroke="#bed0e2" stroke-width="2"/>
    <rect x="535" y="262" width="730" height="48" rx="7" fill="#e9f3d5"/>
    <rect x="535" y="303" width="730" height="7" fill="#e9f3d5"/>
