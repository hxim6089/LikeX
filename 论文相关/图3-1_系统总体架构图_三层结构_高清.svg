    <text class="body" x="590" y="408">REST Controller</text>
    <text class="body" x="590" y="443">JWT 身份解析</text>
    <text class="body" x="590" y="478">WebSocket 消息</text>
    <text class="body" x="590" y="513">文件上传访问</text>
    <text class="body" x="590" y="548">DTO 参数传输</text>

    <rect x="796" y="330" width="205" height="252" rx="6" fill="#f7faee" stroke="#a9c95a"/>
    <rect x="796" y="330" width="205" height="45" rx="6" fill="#b8dc4e"/>
    <rect x="796" y="369" width="205" height="6" fill="#b8dc4e"/>
