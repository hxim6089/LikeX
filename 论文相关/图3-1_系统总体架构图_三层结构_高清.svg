    <rect x="1342" y="330" width="358" height="58" rx="5" fill="#eff8ff" stroke="#79b9db"/>
    <text class="box-title" x="1521" y="355" text-anchor="middle">Spring Data JPA / MySQL</text>
    <text class="small" x="1521" y="378" text-anchor="middle">业务数据与行为数据持久化</text>
    <rect x="1342" y="404" width="358" height="58" rx="5" fill="#eff8ff" stroke="#79b9db"/>
    <text class="box-title" x="1521" y="429" text-anchor="middle">Ollama / DeepSeek API</text>
    <text class="small" x="1521" y="452" text-anchor="middle">智能打标、推荐增强与问答</text>
    <rect x="1342" y="478" width="358" height="58" rx="5" fill="#eff8ff" stroke="#79b9db"/>
    <text class="box-title" x="1521" y="503" text-anchor="middle">Kaggle / 内置数据</text>
    <text class="small" x="1521" y="526" text-anchor="middle">帖子批量导入与种子内容</text>
    <rect x="1342" y="552" width="358" height="42" rx="5" fill="#eff8ff" stroke="#79b9db"/>
    <text class="box-title" x="1521" y="579" text-anchor="middle">uploads 文件目录</text>
  </g>

  <!-- Runtime flow -->
  <text class="small" x="131" y="696">用户请求与系统响应主流程</text>
  <g filter="url(#shadow)">
    <rect x="132" y="730" width="160" height="70" rx="7" fill="#ffffff" stroke="#71a8cf" stroke-width="2"/>
    <text class="box-title" x="212" y="758" text-anchor="middle">浏览器访问</text>
    <text class="small" x="212" y="784" text-anchor="middle">操作页面</text>

    <rect x="340" y="730" width="175" height="70" rx="7" fill="#ffffff" stroke="#71a8cf" stroke-width="2"/>
    <text class="box-title" x="428" y="758" text-anchor="middle">REST / WebSocket</text>
    <text class="small" x="428" y="784" text-anchor="middle">提交请求</text>

    <rect x="563" y="730" width="165" height="70" rx="7" fill="#ffffff" stroke="#9ab94d" stroke-width="2"/>
    <text class="box-title" x="646" y="758" text-anchor="middle">身份校验</text>
    <text class="small" x="646" y="784" text-anchor="middle">解析当前用户</text>

    <rect x="776" y="730" width="165" height="70" rx="7" fill="#ffffff" stroke="#9ab94d" stroke-width="2"/>
    <text class="box-title" x="859" y="758" text-anchor="middle">业务处理</text>
    <text class="small" x="859" y="784" text-anchor="middle">内容与互动</text>

    <rect x="989" y="730" width="165" height="70" rx="7" fill="#ffffff" stroke="#9ab94d" stroke-width="2"/>
    <text class="box-title" x="1072" y="758" text-anchor="middle">行为记录</text>
    <text class="small" x="1072" y="784" text-anchor="middle">更新用户画像</text>

    <rect x="1202" y="730" width="165" height="70" rx="7" fill="#ffffff" stroke="#9ab94d" stroke-width="2"/>
    <text class="box-title" x="1285" y="758" text-anchor="middle">推荐计算</text>
    <text class="small" x="1285" y="784" text-anchor="middle">召回与排序</text>

    <rect x="1415" y="730" width="185" height="70" rx="7" fill="#ffffff" stroke="#71a8cf" stroke-width="2"/>
    <text class="box-title" x="1508" y="758" text-anchor="middle">页面 / 消息更新</text>
    <text class="small" x="1508" y="784" text-anchor="middle">展示处理结果</text>
  </g>

  <path class="flow" d="M 293 765 L 332 765"/>
  <path class="flow" d="M 516 765 L 555 765"/>
  <path class="flow" d="M 729 765 L 768 765"/>
  <path class="flow" d="M 942 765 L 981 765"/>
  <path class="flow" d="M 1155 765 L 1194 765"/>
  <path class="flow" d="M 1368 765 L 1407 765"/>

  <!-- Supporting flows -->
  <g filter="url(#shadow)">
    <rect x="563" y="862" width="230" height="82" rx="7" fill="#ffffff" stroke="#8cb9db" stroke-width="2"/>
    <text class="box-title" x="678" y="894" text-anchor="middle">MySQL 数据库</text>
    <text class="small" x="678" y="920" text-anchor="middle">读取与保存业务数据</text>

    <rect x="850" y="862" width="230" height="82" rx="7" fill="#ffffff" stroke="#8cb9db" stroke-width="2"/>
    <text class="box-title" x="965" y="894" text-anchor="middle">AI 服务</text>
    <text class="small" x="965" y="920" text-anchor="middle">打标、推荐增强与问答</text>

    <rect x="1137" y="862" width="265" height="82" rx="7" fill="#ffffff" stroke="#8cb9db" stroke-width="2"/>
    <text class="box-title" x="1270" y="894" text-anchor="middle">外部数据与文件目录</text>
    <text class="small" x="1270" y="920" text-anchor="middle">导入内容与图片资源</text>
  </g>

  <path class="flow-bi" d="M 858 804 C 858 838, 678 827, 678 854"/>
  <path class="flow-bi" d="M 1285 804 C 1285 838, 965 827, 965 854"/>
  <path class="flow" d="M 1270 854 C 1270 833, 1072 835, 1072 806"/>

  <!-- Column boundary guides -->
  <line x1="514" y1="232" x2="514" y2="646" stroke="#b7c7da" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="1286" y1="232" x2="1286" y2="646" stroke="#b7c7da" stroke-width="1.5" stroke-dasharray="5 6"/>
</svg>
