    <rect x="563" y="330" width="205" height="252" rx="6" fill="#f7faee" stroke="#a9c95a"/>
    <rect x="563" y="330" width="205" height="45" rx="6" fill="#b8dc4e"/>
    <rect x="563" y="369" width="205" height="6" fill="#b8dc4e"/>
