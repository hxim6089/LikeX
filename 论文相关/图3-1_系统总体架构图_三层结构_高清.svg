    <text class="body" x="823" y="408">认证与用户管理</text>
    <text class="body" x="823" y="443">内容发布与互动</text>
    <text class="body" x="823" y="478">关注、搜索与私信</text>
    <text class="body" x="823" y="513">通知与后台管理</text>
    <text class="body" x="823" y="548">广告投放与统计</text>

    <rect x="1029" y="330" width="208" height="252" rx="6" fill="#f7faee" stroke="#a9c95a"/>
    <rect x="1029" y="330" width="208" height="45" rx="6" fill="#b8dc4e"/>
    <rect x="1029" y="369" width="208" height="6" fill="#b8dc4e"/>
