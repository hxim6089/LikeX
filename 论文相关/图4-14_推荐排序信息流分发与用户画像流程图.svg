<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#334155" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .title { font-size: 27px; font-weight: 700; }
      .body { font-size: 20px; fill: #526176; }
      .step { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #2563eb; stroke-width: 3; stroke-dasharray: 10 7; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1500" height="920" fill="#ffffff"/>
  <rect x="28" y="28" width="1444" height="864" rx="12" fill="#f8fafc" stroke="#d8e2ed" stroke-width="2.5"/>

  <!-- Top row -->
  <g filter="url(#shadow)">
    <rect x="105" y="125" width="350" height="170" rx="8" fill="#ffffff" stroke="#5da4d1" stroke-width="3"/>
    <circle cx="150" cy="165" r="25" fill="#4f9fd3"/>
    <text class="step" x="150" y="172" text-anchor="middle">1</text>
    <text class="title" x="280" y="175" text-anchor="middle">采集用户行为</text>
    <text class="body" x="280" y="220" text-anchor="middle">浏览、点赞、评论、转发</text>
    <text class="body" x="280" y="254" text-anchor="middle">搜索、点踩与快速滑过</text>

    <rect x="575" y="125" width="350" height="170" rx="8" fill="#ffffff" stroke="#5da4d1" stroke-width="3"/>
    <circle cx="620" cy="165" r="25" fill="#4f9fd3"/>
    <text class="step" x="620" y="172" text-anchor="middle">2</text>
    <text class="title" x="750" y="175" text-anchor="middle">构建用户画像</text>
    <text class="body" x="750" y="220" text-anchor="middle">兴趣标签、作者偏好</text>
    <text class="body" x="750" y="254" text-anchor="middle">动态权重与用户阶段</text>

    <rect x="1045" y="125" width="350" height="170" rx="8" fill="#ffffff" stroke="#5da4d1" stroke-width="3"/>
    <circle cx="1090" cy="165" r="25" fill="#4f9fd3"/>
    <text class="step" x="1090" y="172" text-anchor="middle">3</text>
    <text class="title" x="1220" y="175" text-anchor="middle">双源候选召回</text>
    <text class="body" x="1220" y="220" text-anchor="middle">网内关注内容 In-Network</text>
    <text class="body" x="1220" y="254" text-anchor="middle">全站内容 Out-of-Network</text>
  </g>

  <path class="arrow" d="M 457 210 L 567 210"/>
  <path class="arrow" d="M 927 210 L 1037 210"/>

  <!-- Turn-down arrow -->
  <path class="arrow" d="M 1220 300 L 1220 395"/>

  <!-- Bottom row, reversed direction -->
  <g filter="url(#shadow)">
    <rect x="1045" y="405" width="350" height="190" rx="8" fill="#ffffff" stroke="#83a83e" stroke-width="3"/>
    <circle cx="1090" cy="445" r="25" fill="#7da43a"/>
    <text class="step" x="1090" y="452" text-anchor="middle">4</text>
    <text class="title" x="1220" y="455" text-anchor="middle">过滤与混合排序</text>
    <text class="body" x="1220" y="500" text-anchor="middle">负反馈过滤、多因子评分</text>
    <text class="body" x="1220" y="534" text-anchor="middle">作者多样性与随机探索</text>
    <text class="body" x="1220" y="568" text-anchor="middle">传统推荐 / AI 推荐策略</text>

    <rect x="575" y="405" width="350" height="190" rx="8" fill="#ffffff" stroke="#83a83e" stroke-width="3"/>
    <circle cx="620" cy="445" r="25" fill="#7da43a"/>
    <text class="step" x="620" y="452" text-anchor="middle">5</text>
    <text class="title" x="750" y="455" text-anchor="middle">分页分发推荐结果</text>
    <text class="body" x="750" y="500" text-anchor="middle">按 page 与 size 截取结果</text>
    <text class="body" x="750" y="534" text-anchor="middle">通过 /api/content/feed 返回</text>
    <text class="body" x="750" y="568" text-anchor="middle">前端追加展示后续内容</text>

    <rect x="105" y="405" width="350" height="190" rx="8" fill="#ffffff" stroke="#83a83e" stroke-width="3"/>
    <circle cx="150" cy="445" r="25" fill="#7da43a"/>
    <text class="step" x="150" y="452" text-anchor="middle">6</text>
    <text class="title" x="280" y="455" text-anchor="middle">用户浏览与互动</text>
    <text class="body" x="280" y="500" text-anchor="middle">展示个性化信息流</text>
    <text class="body" x="280" y="534" text-anchor="middle">产生新的行为反馈</text>
    <text class="body" x="280" y="568" text-anchor="middle">影响下一次推荐分发</text>
  </g>

  <path class="arrow" d="M 1037 500 L 933 500"/>
  <path class="arrow" d="M 567 500 L 463 500"/>

  <!-- Feedback loop -->
  <path class="feedback" d="M 280 600 L 280 710 C 280 780, 105 780, 105 680 L 105 210 L 97 210"/>
  <rect x="126" y="710" width="310" height="48" rx="24" fill="#eaf2ff" stroke="#86aee9" stroke-width="2"/>
  <text class="body" x="281" y="742" text-anchor="middle" fill="#2563eb">行为反馈持续更新用户画像</text>

  <!-- Process annotation -->
  <rect x="515" y="690" width="870" height="100" rx="8" fill="#f1f5f9" stroke="#b7c5d5" stroke-width="2"/>
  <text class="title" x="950" y="730" text-anchor="middle">推荐分发闭环</text>
  <text class="body" x="950" y="768" text-anchor="middle">行为采集 → 画像构建 → 候选召回 → 过滤排序 → 分页分发 → 行为反馈</text>
</svg>
