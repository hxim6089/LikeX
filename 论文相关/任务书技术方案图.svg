<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
  <defs>
    <style>
      .main { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .title { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 19px; font-weight: 700; fill: #111827; }
      .text { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 15px; fill: #1f2937; }
      .small { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 14px; fill: #374151; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 8; ry: 8; }
      .panel { fill: #f8fafc; stroke: #111827; stroke-width: 2; rx: 8; ry: 8; }
      .module { fill: #ffffff; stroke: #475569; stroke-width: 1.6; rx: 6; ry: 6; }
      .line { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowSmall); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1460" height="880" fill="#ffffff"/>

  <g id="system-core">
    <rect x="470" y="45" width="560" height="72" class="box"/>
    <text x="750" y="76" text-anchor="middle" class="main">基于用户行为分析的实时信息流排序与分发系统</text>
    <text x="750" y="103" text-anchor="middle" class="small">前后端分离、行为建模、个性化推荐、AI 增强与广告分发</text>
  </g>

  <g id="input-panel">
    <rect x="55" y="170" width="235" height="550" class="panel"/>
    <text x="172" y="207" text-anchor="middle" class="title">业务数据输入</text>
    <rect x="85" y="245" width="175" height="58" class="module"/>
    <text x="172" y="270" text-anchor="middle" class="text">用户基础数据</text>
    <text x="172" y="292" text-anchor="middle" class="small">注册、登录、角色</text>

    <rect x="85" y="325" width="175" height="58" class="module"/>
    <text x="172" y="350" text-anchor="middle" class="text">内容数据</text>
    <text x="172" y="372" text-anchor="middle" class="small">帖文、图片、标签</text>

    <rect x="85" y="405" width="175" height="58" class="module"/>
    <text x="172" y="430" text-anchor="middle" class="text">行为数据</text>
    <text x="172" y="452" text-anchor="middle" class="small">浏览、点赞、评论、转发</text>

    <rect x="85" y="485" width="175" height="58" class="module"/>
    <text x="172" y="510" text-anchor="middle" class="text">社交关系数据</text>
    <text x="172" y="532" text-anchor="middle" class="small">关注、粉丝、私信</text>

    <rect x="85" y="565" width="175" height="58" class="module"/>
    <text x="172" y="590" text-anchor="middle" class="text">搜索与热门话题</text>
    <text x="172" y="612" text-anchor="middle" class="small">关键词、Hashtag</text>

    <rect x="85" y="645" width="175" height="48" class="module"/>
    <text x="172" y="675" text-anchor="middle" class="text">广告与外部数据</text>
  </g>

  <g id="platform-panel">
    <rect x="365" y="170" width="260" height="550" class="panel"/>
    <text x="495" y="207" text-anchor="middle" class="title">基础平台层</text>
    <rect x="395" y="245" width="200" height="66" class="module"/>
    <text x="495" y="272" text-anchor="middle" class="text">Vue 3 前端</text>
    <text x="495" y="295" text-anchor="middle" class="small">Vite、Element Plus、ECharts</text>

    <rect x="395" y="340" width="200" height="82" class="module"/>
    <text x="495" y="369" text-anchor="middle" class="text">Spring Boot 后端</text>
    <text x="495" y="392" text-anchor="middle" class="small">REST API、WebSocket</text>
    <text x="495" y="414" text-anchor="middle" class="small">Controller / Service / Repository</text>

    <rect x="395" y="455" width="200" height="66" class="module"/>
    <text x="495" y="482" text-anchor="middle" class="text">MySQL 数据库</text>
    <text x="495" y="505" text-anchor="middle" class="small">用户、内容、行为、广告</text>

    <rect x="395" y="555" width="200" height="66" class="module"/>
    <text x="495" y="582" text-anchor="middle" class="text">数据导入与初始化</text>
    <text x="495" y="605" text-anchor="middle" class="small">模拟数据、公开数据集</text>

    <rect x="395" y="650" width="200" height="48" class="module"/>
    <text x="495" y="680" text-anchor="middle" class="text">统一配置与文件上传</text>
  </g>

  <g id="analysis-panel">
    <rect x="700" y="170" width="280" height="550" class="panel"/>
    <text x="840" y="207" text-anchor="middle" class="title">行为分析与画像层</text>

    <rect x="730" y="245" width="220" height="70" class="module"/>
    <text x="840" y="273" text-anchor="middle" class="text">统一行为数据模型</text>
    <text x="840" y="296" text-anchor="middle" class="small">userId、contentId、type、time</text>

    <rect x="730" y="345" width="220" height="70" class="module"/>
    <text x="840" y="373" text-anchor="middle" class="text">行为类型与时间赋权</text>
    <text x="840" y="396" text-anchor="middle" class="small">转发 &gt; 评论 &gt; 点赞 &gt; 浏览</text>

    <rect x="730" y="445" width="220" height="95" class="module"/>
    <text x="840" y="474" text-anchor="middle" class="text">用户画像构建</text>
    <text x="840" y="497" text-anchor="middle" class="small">兴趣标签、作者偏好</text>
    <text x="840" y="520" text-anchor="middle" class="small">活跃时段、互动风格、深度偏好</text>

    <rect x="730" y="570" width="220" height="70" class="module"/>
    <text x="840" y="598" text-anchor="middle" class="text">负反馈信号处理</text>
    <text x="840" y="621" text-anchor="middle" class="small">不感兴趣、屏蔽作者、隐藏内容</text>

    <rect x="730" y="665" width="220" height="38" class="module"/>
    <text x="840" y="690" text-anchor="middle" class="text">生成动态推荐权重</text>
  </g>

  <g id="algorithm-panel">
    <rect x="1055" y="170" width="390" height="550" class="panel"/>
    <text x="1250" y="207" text-anchor="middle" class="title">排序分发与智能扩展层</text>

    <rect x="1085" y="245" width="160" height="90" class="module"/>
    <text x="1165" y="272" text-anchor="middle" class="text">候选召回</text>
    <text x="1165" y="295" text-anchor="middle" class="small">网内来源</text>
    <text x="1165" y="317" text-anchor="middle" class="small">网外内容与热门话题</text>

    <rect x="1260" y="245" width="155" height="90" class="module"/>
    <text x="1338" y="272" text-anchor="middle" class="text">混合多因子排序</text>
    <text x="1338" y="295" text-anchor="middle" class="small">互动评分、TF-IDF</text>
    <text x="1338" y="317" text-anchor="middle" class="small">协同过滤、时间衰减</text>

    <rect x="1085" y="365" width="160" height="86" class="module"/>
    <text x="1165" y="392" text-anchor="middle" class="text">重排与探索</text>
    <text x="1165" y="415" text-anchor="middle" class="small">作者多样性惩罚</text>
    <text x="1165" y="437" text-anchor="middle" class="small">加权随机采样</text>

    <rect x="1260" y="365" width="155" height="86" class="module"/>
    <text x="1338" y="392" text-anchor="middle" class="text">信息流分发</text>
    <text x="1338" y="415" text-anchor="middle" class="small">For You</text>
    <text x="1338" y="437" text-anchor="middle" class="small">Following / 搜索结果</text>

    <rect x="1085" y="485" width="160" height="86" class="module"/>
    <text x="1165" y="512" text-anchor="middle" class="text">AI 智能模块</text>
    <text x="1165" y="535" text-anchor="middle" class="small">Ollama / DeepSeek</text>
    <text x="1165" y="557" text-anchor="middle" class="small">问答、打标、推荐理由</text>

    <rect x="1260" y="485" width="155" height="86" class="module"/>
    <text x="1338" y="512" text-anchor="middle" class="text">广告智能投放</text>
    <text x="1338" y="535" text-anchor="middle" class="small">画像标签匹配</text>
    <text x="1338" y="557" text-anchor="middle" class="small">出价与曝光统计</text>

    <rect x="1085" y="605" width="330" height="70" class="module"/>
    <text x="1250" y="633" text-anchor="middle" class="text">算法效果可视化与参数调优</text>
    <text x="1250" y="656" text-anchor="middle" class="small">推荐/时间流对比、权重面板、排序管道漏斗、统计图表</text>
  </g>

  <g id="result">
    <rect x="430" y="800" width="640" height="70" class="box"/>
    <text x="750" y="829" text-anchor="middle" class="main">系统输出结果</text>
    <text x="750" y="856" text-anchor="middle" class="small">个性化信息流、实时互动通知、AI 辅助服务、精准广告投放、可视化实验结果</text>
  </g>

  <path d="M 290 445 L 365 445" class="line"/>
  <path d="M 625 445 L 700 445" class="line"/>
  <path d="M 980 445 L 1055 445" class="line"/>
  <path d="M 750 117 C 750 140, 495 140, 495 170" class="thin"/>
  <path d="M 750 117 C 750 140, 840 140, 840 170" class="thin"/>
  <path d="M 750 117 C 750 140, 1250 140, 1250 170" class="thin"/>

  <path d="M 1250 720 C 1250 775, 1040 780, 970 800" class="line"/>
  <path d="M 840 720 C 840 760, 790 775, 770 800" class="line"/>
  <path d="M 495 720 C 495 760, 560 775, 610 800" class="line"/>

  <path d="M 1338 571 C 1338 735, 1080 760, 1010 800" class="dash"/>
  <path d="M 1165 571 C 1165 705, 1000 750, 930 800" class="dash"/>

  <text x="327" y="430" text-anchor="middle" class="small">采集与存储</text>
  <text x="662" y="430" text-anchor="middle" class="small">画像计算</text>
  <text x="1018" y="430" text-anchor="middle" class="small">排序分发</text>
</svg>
