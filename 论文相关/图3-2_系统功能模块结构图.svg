<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 45 1200 715">
  <defs>
    <style>
      .title { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .center { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .box-title { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
      .text { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 17px; fill: #1f2937; }
      .small { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 15px; fill: #374151; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 8; ry: 8; }
      .module { fill: #f8fafc; stroke: #334155; stroke-width: 1.8; rx: 8; ry: 8; }
      .line { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="720" fill="#ffffff"/>
  <g>
    <rect x="390" y="95" width="420" height="82" class="box"/>
    <text x="600" y="145" text-anchor="middle" class="center">实时信息流排序与分发系统</text>
  </g>

  <g>
    <rect x="70" y="230" width="300" height="175" class="module"/>
    <text x="220" y="270" text-anchor="middle" class="box-title">用户端业务模块</text>
    <text x="105" y="311" class="text">用户注册、登录认证</text>
    <text x="105" y="342" class="text">内容发布、评论、转发</text>
    <text x="105" y="373" class="text">点赞点踩、关注、私信通知</text>
  </g>

  <g>
    <rect x="450" y="230" width="300" height="175" class="module"/>
    <text x="600" y="270" text-anchor="middle" class="box-title">推荐算法模块</text>
    <text x="485" y="311" class="text">行为采集与用户画像</text>
    <text x="485" y="342" class="text">候选内容召回与综合评分</text>
    <text x="485" y="373" class="text">排序重排、负反馈过滤</text>
  </g>

  <g>
    <rect x="830" y="230" width="300" height="175" class="module"/>
    <text x="980" y="270" text-anchor="middle" class="box-title">AI 智能模块</text>
    <text x="865" y="311" class="text">AI 内容打标</text>
    <text x="865" y="342" class="text">AI 推荐排序与推荐理由</text>
    <text x="865" y="373" class="text">服务异常降级处理</text>
  </g>

  <g>
    <rect x="70" y="485" width="300" height="175" class="module"/>
    <text x="220" y="525" text-anchor="middle" class="box-title">广告模块</text>
    <text x="105" y="566" class="text">广告配置与素材管理</text>
    <text x="105" y="597" class="text">用户画像匹配与信息流插入</text>
    <text x="105" y="628" class="text">曝光、点击与统计分析</text>
  </g>

  <g>
    <rect x="450" y="485" width="300" height="175" class="module"/>
    <text x="600" y="525" text-anchor="middle" class="box-title">管理后台模块</text>
    <text x="485" y="566" class="text">用户管理与权限控制</text>
    <text x="485" y="597" class="text">内容治理与策略切换</text>
    <text x="485" y="628" class="text">系统统计与运行监控</text>
  </g>

  <g>
    <rect x="830" y="485" width="300" height="175" class="module"/>
    <text x="980" y="525" text-anchor="middle" class="box-title">数据导入模块</text>
    <text x="865" y="566" class="text">外部数据抓取与批量导入</text>
    <text x="865" y="597" class="text">数据清洗、去重与标签补齐</text>
    <text x="865" y="628" class="text">种子数据生成与内容扩充</text>
  </g>

  <path d="M 495 177 L 260 230" class="line"/>
  <path d="M 600 177 L 600 230" class="line"/>
  <path d="M 705 177 L 940 230" class="line"/>
  <path d="M 500 177 C 315 315, 280 405, 250 485" class="line"/>
  <path d="M 600 177 L 600 485" class="line"/>
  <path d="M 700 177 C 885 315, 920 405, 950 485" class="line"/>

  <text x="600" y="707" text-anchor="middle" class="small">说明：各功能模块围绕内容生产、行为采集、推荐排序、智能增强、广告分发和后台治理形成完整业务闭环。</text>
</svg>
