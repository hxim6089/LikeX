<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 45 1400 855">
  <defs>
    <style>
      .title { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .entity-title { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .field { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 15px; fill: #1f2937; }
      .rel { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .note { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 15px; fill: #374151; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 8; ry: 8; }
      .head { fill: #f1f5f9; stroke: #111827; stroke-width: 2; rx: 8; ry: 8; }
      .divider { stroke: #111827; stroke-width: 1.6; }
      .line { stroke: #111827; stroke-width: 2; fill: none; }
      .dash { stroke: #475569; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
    </style>
  </defs>

  <rect x="20" y="20" width="1360" height="860" fill="#ffffff"/>
  <g id="user">
    <rect x="70" y="115" width="250" height="230" class="box"/>
    <rect x="70" y="115" width="250" height="45" class="head"/>
    <text x="195" y="144" text-anchor="middle" class="entity-title">用户 User</text>
    <line x1="70" y1="160" x2="320" y2="160" class="divider"/>
    <text x="95" y="192" class="field">PK id</text>
    <text x="95" y="220" class="field">username</text>
    <text x="95" y="248" class="field">password</text>
    <text x="95" y="276" class="field">role / banned</text>
    <text x="95" y="304" class="field">bio / avatarUrl</text>
    <text x="95" y="332" class="field">customWeights</text>
  </g>

  <g id="content">
    <rect x="515" y="115" width="290" height="260" class="box"/>
    <rect x="515" y="115" width="290" height="45" class="head"/>
    <text x="660" y="144" text-anchor="middle" class="entity-title">内容 Content</text>
    <line x1="515" y1="160" x2="805" y2="160" class="divider"/>
    <text x="540" y="192" class="field">PK id</text>
    <text x="540" y="220" class="field">FK author_id</text>
    <text x="540" y="248" class="field">content / imageUrl</text>
    <text x="540" y="276" class="field">category / createdAt</text>
    <text x="540" y="304" class="field">viewCount / likeCount</text>
    <text x="540" y="332" class="field">commentCount / repostCount</text>
    <text x="540" y="360" class="field">parentId / repostOf / quoteOf</text>
  </g>

  <g id="content_tags">
    <rect x="890" y="175" width="205" height="120" class="box"/>
    <rect x="890" y="175" width="205" height="42" class="head"/>
    <text x="992" y="202" text-anchor="middle" class="entity-title">content_tags</text>
    <line x1="890" y1="217" x2="1095" y2="217" class="divider"/>
    <text x="915" y="249" class="field">FK content_id</text>
    <text x="915" y="277" class="field">FK tag_id</text>
  </g>

  <g id="tag">
    <rect x="1165" y="150" width="170" height="150" class="box"/>
    <rect x="1165" y="150" width="170" height="42" class="head"/>
    <text x="1250" y="177" text-anchor="middle" class="entity-title">标签 Tag</text>
    <line x1="1165" y1="192" x2="1335" y2="192" class="divider"/>
    <text x="1190" y="225" class="field">PK id</text>
    <text x="1190" y="253" class="field">name</text>
  </g>

  <g id="behavior">
    <rect x="515" y="455" width="290" height="195" class="box"/>
    <rect x="515" y="455" width="290" height="42" class="head"/>
    <text x="660" y="482" text-anchor="middle" class="entity-title">行为 Behavior</text>
    <line x1="515" y1="497" x2="805" y2="497" class="divider"/>
    <text x="540" y="529" class="field">PK id</text>
    <text x="540" y="557" class="field">FK user_id</text>
    <text x="540" y="585" class="field">FK content_id</text>
    <text x="540" y="613" class="field">type / duration</text>
    <text x="540" y="641" class="field">createdAt</text>
  </g>

  <g id="follow">
    <rect x="70" y="455" width="250" height="170" class="box"/>
    <rect x="70" y="455" width="250" height="42" class="head"/>
    <text x="195" y="482" text-anchor="middle" class="entity-title">关注 Follow</text>
    <line x1="70" y1="497" x2="320" y2="497" class="divider"/>
    <text x="95" y="529" class="field">PK id</text>
    <text x="95" y="557" class="field">FK follower_id</text>
    <text x="95" y="585" class="field">FK followee_id</text>
    <text x="95" y="613" class="field">createdAt</text>
  </g>

  <g id="notification">
    <rect x="880" y="430" width="250" height="195" class="box"/>
    <rect x="880" y="430" width="250" height="42" class="head"/>
    <text x="1005" y="457" text-anchor="middle" class="entity-title">通知 Notification</text>
    <line x1="880" y1="472" x2="1130" y2="472" class="divider"/>
    <text x="905" y="504" class="field">PK id</text>
    <text x="905" y="532" class="field">FK recipient_id</text>
    <text x="905" y="560" class="field">FK actor_id</text>
    <text x="905" y="588" class="field">type / entity_id</text>
    <text x="905" y="616" class="field">isRead / createdAt</text>
  </g>

  <g id="message">
    <rect x="1165" y="430" width="190" height="195" class="box"/>
    <rect x="1165" y="430" width="190" height="42" class="head"/>
    <text x="1260" y="457" text-anchor="middle" class="entity-title">私信 Message</text>
    <line x1="1165" y1="472" x2="1355" y2="472" class="divider"/>
    <text x="1190" y="504" class="field">PK id</text>
    <text x="1190" y="532" class="field">FK sender_id</text>
    <text x="1190" y="560" class="field">FK recipient_id</text>
    <text x="1190" y="588" class="field">content</text>
    <text x="1190" y="616" class="field">isRead / createdAt</text>
  </g>

  <g id="ad">
    <rect x="515" y="710" width="290" height="145" class="box"/>
    <rect x="515" y="710" width="290" height="42" class="head"/>
    <text x="660" y="737" text-anchor="middle" class="entity-title">广告 Ad</text>
    <line x1="515" y1="752" x2="805" y2="752" class="divider"/>
    <text x="540" y="784" class="field">PK id</text>
    <text x="540" y="812" class="field">title / imageUrl / targetUrl</text>
    <text x="540" y="840" class="field">targetTags / impressions / clicks</text>
  </g>

  <g id="adconfig">
    <rect x="880" y="710" width="250" height="145" class="box"/>
    <rect x="880" y="710" width="250" height="42" class="head"/>
    <text x="1005" y="737" text-anchor="middle" class="entity-title">广告配置 AdConfig</text>
    <line x1="880" y1="752" x2="1130" y2="752" class="divider"/>
    <text x="905" y="784" class="field">PK id</text>
    <text x="905" y="812" class="field">enabled / frequency</text>
    <text x="905" y="840" class="field">maxAdsPerPage</text>
  </g>

  <path d="M 320 220 L 515 220" class="line"/>
  <text x="352" y="209" class="rel">1</text>
  <text x="488" y="209" class="rel">N</text>
  <text x="418" y="205" text-anchor="middle" class="note">发布</text>

  <path d="M 660 375 L 660 455" class="line"/>
  <text x="674" y="397" class="rel">1</text>
  <text x="674" y="447" class="rel">N</text>
  <text x="700" y="419" class="note">产生行为</text>

  <path d="M 320 555 L 515 555" class="line"/>
  <text x="352" y="544" class="rel">1</text>
  <text x="488" y="544" class="rel">N</text>
  <text x="418" y="540" text-anchor="middle" class="note">执行</text>

  <path d="M 195 345 L 195 455" class="line"/>
  <text x="210" y="373" class="rel">1</text>
  <text x="210" y="445" class="rel">N</text>
  <text x="235" y="404" class="note">关注关系</text>

  <path d="M 320 285 C 550 410, 720 430, 880 520" class="line"/>
  <text x="342" y="305" class="rel">1</text>
  <text x="855" y="509" class="rel">N</text>
  <text x="600" y="405" text-anchor="middle" class="note">接收/触发通知</text>

  <path d="M 320 305 C 605 525, 940 530, 1165 530" class="line"/>
  <text x="343" y="326" class="rel">1</text>
  <text x="1138" y="519" class="rel">N</text>
  <text x="750" y="548" text-anchor="middle" class="note">发送/接收私信</text>

  <path d="M 805 230 L 890 230" class="line"/>
  <text x="820" y="218" class="rel">1</text>
  <text x="868" y="218" class="rel">N</text>
  <path d="M 1095 230 L 1165 230" class="line"/>
  <text x="1110" y="218" class="rel">N</text>
  <text x="1142" y="218" class="rel">1</text>
  <text x="995" y="158" text-anchor="middle" class="note">多对多：内容标签关联</text>

  <path d="M 805 300 C 850 370, 846 420, 880 480" class="line"/>
  <text x="820" y="322" class="rel">1</text>
  <text x="860" y="472" class="rel">N</text>
  <text x="860" y="392" text-anchor="middle" class="note">关联业务对象</text>

  <path d="M 660 650 L 660 710" class="dash"/>
  <text x="700" y="687" class="note">画像匹配投放</text>

  <path d="M 805 785 L 880 785" class="line"/>
  <text x="820" y="773" class="rel">N</text>
  <text x="855" y="773" class="rel">1</text>
  <text x="842" y="813" text-anchor="middle" class="note">投放控制</text>

  <path d="M 515 346 C 450 405, 450 120, 515 178" class="dash"/>
  <text x="430" y="262" text-anchor="middle" class="note">评论/转发/引用</text>

  <text x="700" y="883" text-anchor="middle" class="note">说明：图中 1 和 N 表示实体之间的一对多关系；内容与标签通过 content_tags 中间表形成多对多关系；广告配置控制广告投放策略。</text>
</svg>
