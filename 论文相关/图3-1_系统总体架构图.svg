<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 45 1200 675">
  <defs>
    <style>
      .title { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .box-title { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 22px; font-weight: 700; fill: #111827; }
      .text { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 18px; fill: #1f2937; }
      .small { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 16px; fill: #374151; }
      .label { font-family: "Microsoft YaHei", "SimSun", sans-serif; font-size: 16px; font-weight: 700; fill: #111827; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 8; ry: 8; }
      .subbox { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 6; ry: 6; }
      .line { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="680" fill="#ffffff"/>
  <g>
    <rect x="60" y="150" width="250" height="360" class="box"/>
    <text x="185" y="190" text-anchor="middle" class="box-title">浏览器客户端</text>
    <rect x="88" y="225" width="194" height="56" class="subbox"/>
    <text x="185" y="259" text-anchor="middle" class="text">用户访问页面</text>
    <rect x="88" y="300" width="194" height="56" class="subbox"/>
    <text x="185" y="334" text-anchor="middle" class="text">Vue 3 前端</text>
    <rect x="88" y="375" width="194" height="56" class="subbox"/>
    <text x="185" y="409" text-anchor="middle" class="text">Axios 请求</text>
    <rect x="88" y="450" width="194" height="40" class="subbox"/>
    <text x="185" y="476" text-anchor="middle" class="small">WebSocket 客户端</text>
  </g>

  <g>
    <rect x="470" y="120" width="300" height="420" class="box"/>
    <text x="620" y="160" text-anchor="middle" class="box-title">Spring Boot 后端</text>
    <rect x="500" y="195" width="240" height="48" class="subbox"/>
    <text x="620" y="226" text-anchor="middle" class="text">Controller 接口层</text>
    <rect x="500" y="262" width="240" height="48" class="subbox"/>
    <text x="620" y="293" text-anchor="middle" class="text">Service 业务与算法层</text>
    <rect x="500" y="329" width="240" height="48" class="subbox"/>
    <text x="620" y="360" text-anchor="middle" class="text">Repository 持久层</text>
    <rect x="500" y="396" width="240" height="48" class="subbox"/>
    <text x="620" y="427" text-anchor="middle" class="text">WebSocket 消息服务</text>
    <rect x="500" y="463" width="240" height="48" class="subbox"/>
    <text x="620" y="494" text-anchor="middle" class="text">文件上传与配置管理</text>
  </g>

  <g>
    <rect x="900" y="95" width="240" height="96" class="box"/>
    <text x="1020" y="132" text-anchor="middle" class="box-title">MySQL 数据库</text>
    <text x="1020" y="165" text-anchor="middle" class="small">用户、内容、行为、广告</text>
  </g>

  <g>
    <rect x="900" y="245" width="240" height="110" class="box"/>
    <text x="1020" y="283" text-anchor="middle" class="box-title">AI 服务</text>
    <text x="1020" y="316" text-anchor="middle" class="small">Ollama 本地模型</text>
    <text x="1020" y="340" text-anchor="middle" class="small">DeepSeek API</text>
  </g>

  <g>
    <rect x="900" y="410" width="240" height="110" class="box"/>
    <text x="1020" y="448" text-anchor="middle" class="box-title">外部数据源</text>
    <text x="1020" y="481" text-anchor="middle" class="small">公开数据集与抓取脚本</text>
    <text x="1020" y="505" text-anchor="middle" class="small">批量导入与清洗</text>
  </g>

  <g>
    <rect x="900" y="575" width="240" height="70" class="box"/>
    <text x="1020" y="618" text-anchor="middle" class="box-title">文件存储目录</text>
  </g>

  <path d="M 310 280 C 360 280, 405 245, 470 245" class="line"/>
  <text x="390" y="239" text-anchor="middle" class="label">Axios / REST API</text>

  <path d="M 310 430 C 360 430, 405 430, 470 430" class="line"/>
  <text x="390" y="417" text-anchor="middle" class="label">WebSocket</text>

  <path d="M 770 335 C 835 335, 830 143, 900 143" class="line"/>
  <text x="836" y="182" text-anchor="middle" class="label">JPA</text>

  <path d="M 770 330 C 830 330, 835 300, 900 300" class="line"/>
  <text x="835" y="303" text-anchor="middle" class="label">AI 打标/推荐</text>

  <path d="M 770 390 C 835 390, 835 465, 900 465" class="line"/>
  <text x="835" y="432" text-anchor="middle" class="label">数据导入</text>

  <path d="M 770 500 C 835 500, 835 610, 900 610" class="line"/>
  <text x="835" y="564" text-anchor="middle" class="label">图片上传</text>

  <path d="M 470 185 C 410 110, 235 102, 185 150" class="dash"/>
  <text x="330" y="113" text-anchor="middle" class="label">页面渲染与状态更新</text>

  <text x="600" y="666" text-anchor="middle" class="small">说明：前端负责页面交互与请求发送，后端统一处理认证、内容、推荐、AI、广告和管理业务，并与数据库及外部服务完成数据交换。</text>
</svg>
